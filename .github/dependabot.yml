# Keeps backend Python deps, frontend npm deps, GitHub Actions, and the
# Docker base images fresh. Grouping keeps routine minor/patch bumps to one
# PR per ecosystem; majors stay individual for review.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "javascript"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Deferred majors — each needs a dedicated migration, tracked separately.
    # Remove an entry to let Dependabot propose that major again.
    ignore:
      # vite 8 switches to the rolldown bundler, whose native bindings hit the
      # npm optionalDependencies bug (npm/cli#4828). Hold vite (and its React
      # plugin, which follows vite's majors) on 7.x for now.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go-port) preview; typescript-eslint peers
      # still require typescript < 6.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Tailwind CSS 4 is a CSS-first config-model migration.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
