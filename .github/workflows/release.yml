name: Release

# Pushing a v*.*.* tag builds the image and publishes identical immutable
# tags to GHCR and Docker Hub, with an SBOM + provenance and a Trivy gate.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub release + attach SBOM
  packages: write   # push to ghcr.io
  id-token: write   # provenance attestation

jobs:
  # Re-run the full quality gate on the tagged commit so a release can't
  # bypass lint/tests/audit (a tag may point at an unchecked commit).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint + build + audit
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend ruff + pytest + pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r backend/requirements-dev.txt
          ruff check backend/
          (cd backend && pytest -q)
          pip-audit -r backend/requirements.txt --strict

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Requires DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (an access token) secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/extremecanada/sonic-mcp-community-client
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # OCI refs must be lowercase, but github.repository preserves the owner's
      # case (YuryOstrovsky). Lowercase it for the by-digest scan/SBOM refs.
      - name: Compute lowercase image ref
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM artifact (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan pushed image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: table
          exit-code: "1"          # a release should not ship known CRITICALs
          ignore-unfixed: true
          severity: CRITICAL

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sbom.spdx.json
