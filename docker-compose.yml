# SONiC MCP Community Client — one-command deploy.
#
# Prerequisites on the host:
#   1. The SONiC MCP Community Server is reachable (default port 8000).
#      Edit MCP_BASE_URL in .env if it lives on a different host/port.
#   2. Copy .env.example -> .env and tweak as needed.
#
# Run:
#     docker compose up -d
#     open http://<host>:5174/
#
# The client is a UI + thin proxy. It does not persist device credentials;
# credentials entered during inventory add/probe pass THROUGH to the MCP
# server. Persistent state (LLM prefs, optional API keys) lives in
# settings.json under ./data on the host so it survives rebuilds.

services:
  client:
    # Uncomment `build: .` to build locally instead of pulling the published image.
    # build: .
    image: extremecanada/sonic-mcp-community-client:latest
    container_name: sonic-mcp-client
    restart: unless-stopped

    env_file:
      - .env
    environment:
      # If the server is on the same host machine (outside Docker), use
      # host.docker.internal. For a server also in Docker on a shared
      # network, set MCP_BASE_URL in .env to its container name:port.
      - MCP_BASE_URL=${MCP_BASE_URL:-http://host.docker.internal:8000}
      # Settings persist inside the mounted ./data volume (survives rebuilds).
      - CLIENT_SETTINGS_PATH=/app/backend/data/settings.json
      # Upstream + client-facing auth — set both in .env for a secure setup
      # (see SECURITY.md). Passed through from .env if present.
      - MCP_API_KEY=${MCP_API_KEY:-}
      - CLIENT_API_KEY=${CLIENT_API_KEY:-}

    ports:
      # Bound to localhost by DEFAULT — this proxy can invoke network-management
      # tools and edit stored API keys, so it must not be world-reachable. For
      # deliberate LAN access override to "5174:5174" AND put an authenticated
      # reverse proxy in front. See SECURITY.md.
      - "127.0.0.1:5174:5174"

    volumes:
      # Persistent settings.json (LLM provider, optional API keys).
      # Mode 0600 is enforced by the backend when it writes the file.
      - ./data:/app/backend/data

    # Lets the container reach services bound to the host's localhost on
    # platforms that don't resolve host.docker.internal by default (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5174/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
